name: personal-agent

x-agent-environment: &agent-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Containers reach the database by service name; the host-side DATABASE_URL in
  # .env is for running tools outside Docker.
  DATABASE_URL: postgresql://${POSTGRES_USER:-personal_agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-personal_agent}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_agent}
      POSTGRES_USER: ${POSTGRES_USER:-personal_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback only: host-side tests and tools use it; nothing else should.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-54331}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-local}
    image: personal-agent:${APP_REVISION:-local}
    command: ["personal-agent-migrate"]
    environment: *agent-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
