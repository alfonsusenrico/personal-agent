name: personal-agent

# Locally `.env` supplies these names (scripts/setup-local). On the server the release
# engine supplies the runtime settings, image references (AF_IMAGE_APP, AF_IMAGE_BACKUP),
# and secret files; deploy/compose.production.yaml adds what differs there.
x-agent-environment: &agent-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Containers reach the database by service name; the host-side DATABASE_URL in
  # .env is for running tools outside Docker. Deployments clear this and use DATABASE_*
  # parts with a password file; the application names whatever is missing.
  DATABASE_URL: postgresql://${POSTGRES_USER:-personal_agent}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-personal_agent}

x-agent-runtime: &agent-runtime
  # Forwards stop signals: the service process would otherwise run as PID 1.
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  logging: &bounded-logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 60s
    logging: *bounded-logs
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_agent}
      POSTGRES_USER: ${POSTGRES_USER:-personal_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback only: host-side tests and tools use it; nothing else should.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-54331}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *agent-runtime
    build:
      context: .
      target: runtime
      args:
        AF_REVISION: ${AF_REVISION:-local}
    image: ${AF_IMAGE_APP:-personal-agent:${AF_REVISION:-local}}
    command: ["personal-agent-migrate"]
    environment: *agent-environment
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *agent-runtime
    image: ${AF_IMAGE_APP:-personal-agent:${AF_REVISION:-local}}
    command: ["personal-agent-worker"]
    environment:
      <<: *agent-environment
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS}
      # Locally the gateway runs in its own compose project on the host's loopback port.
      GATEWAY_URL: ${WORKER_GATEWAY_URL:-http://host.docker.internal:8360}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      REPLY_PROFILE: ${REPLY_PROFILE:-reply}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
      TURN_DEBOUNCE_SECONDS: ${TURN_DEBOUNCE_SECONDS:-2}
      RECENT_WINDOW_TOKENS: ${RECENT_WINDOW_TOKENS:-6000}
      OFFLINE_NOTICE_AFTER_SECONDS: ${OFFLINE_NOTICE_AFTER_SECONDS:-300}
      DRAFT_INTERVAL_SECONDS: ${DRAFT_INTERVAL_SECONDS:-1}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 256m
    # The health endpoint (revision, polling, database), on loopback only.
    ports:
      - "127.0.0.1:${AGENT_HEALTH_PORT:-8380}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # A reply in progress is finished after the restart by the exactly-once rules.
    stop_grace_period: 30s
    restart: unless-stopped

  # Daily encrypted backups into a restic repository in BACKUP_DIR, a host folder
  # outside the repository. Also runs scripts/review and scripts/restore-check.
  backup:
    <<: *agent-runtime
    build:
      context: .
      target: backup
      args:
        AF_REVISION: ${AF_REVISION:-local}
    image: ${AF_IMAGE_BACKUP:-personal-agent-backup:${AF_REVISION:-local}}
    command: ["personal-agent-backup"]
    environment:
      <<: *agent-environment
      RESTIC_REPOSITORY: /backups
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
    # restic keeps a temporary cache while it checks the repository.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    mem_limit: 512m
    volumes:
      - ${BACKUP_DIR:?Set BACKUP_DIR}:/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
