name: personal-agent

x-agent-environment: &agent-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Containers reach the database by service name; the host-side DATABASE_URL in
  # .env is for running tools outside Docker.
  DATABASE_URL: postgresql://${POSTGRES_USER:-personal_agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-personal_agent}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_agent}
      POSTGRES_USER: ${POSTGRES_USER:-personal_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback only: host-side tests and tools use it; nothing else should.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-54331}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: runtime
      args:
        APP_REVISION: ${APP_REVISION:-local}
    image: personal-agent:${APP_REVISION:-local}
    command: ["personal-agent-migrate"]
    environment: *agent-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    image: personal-agent:${APP_REVISION:-local}
    command: ["personal-agent-worker"]
    environment:
      <<: *agent-environment
      APP_REVISION: ${APP_REVISION:-local}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS in .env}
      # The gateway runs in its own compose project on the host's loopback port.
      GATEWAY_URL: ${WORKER_GATEWAY_URL:-http://host.docker.internal:8360}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in .env}
      REPLY_PROFILE: ${REPLY_PROFILE:-reply}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
      TURN_DEBOUNCE_SECONDS: ${TURN_DEBOUNCE_SECONDS:-2}
      RECENT_WINDOW_TOKENS: ${RECENT_WINDOW_TOKENS:-6000}
      OFFLINE_NOTICE_AFTER_SECONDS: ${OFFLINE_NOTICE_AFTER_SECONDS:-300}
      DRAFT_INTERVAL_SECONDS: ${DRAFT_INTERVAL_SECONDS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Daily encrypted backups into a restic repository in BACKUP_DIR, a host folder
  # outside the repository. Also runs scripts/review and scripts/restore-check.
  backup:
    build:
      context: .
      target: backup
      args:
        APP_REVISION: ${APP_REVISION:-local}
    image: personal-agent-backup:${APP_REVISION:-local}
    command: ["personal-agent-backup"]
    # Forwards stop signals: the service process would otherwise run as PID 1.
    init: true
    environment:
      <<: *agent-environment
      APP_REVISION: ${APP_REVISION:-local}
      RESTIC_REPOSITORY: /backups
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
    volumes:
      - ${BACKUP_DIR:?Set BACKUP_DIR in .env}:/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
