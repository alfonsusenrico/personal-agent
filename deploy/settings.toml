# Every runtime name of a deployment and its single source (contracts v1 §4).
af_standard = 1
required = [
    "APP_ENV", "LOG_LEVEL", "POSTGRES_DB", "POSTGRES_USER", "GATEWAY_URL", "REPLY_PROFILE",
    "DEFAULT_TIMEZONE",
    "TELEGRAM_ALLOWED_USER_IDS", "BACKUP_DIR", "AGENT_HEALTH_PORT", "AGENT_GATEWAY_NETWORK",
    "POSTGRES_PASSWORD", "TELEGRAM_BOT_TOKEN", "GATEWAY_API_KEY", "RESTIC_PASSWORD",
]
optional = [
    "TURN_DEBOUNCE_SECONDS", "RECENT_WINDOW_TOKENS", "OFFLINE_NOTICE_AFTER_SECONDS",
    "DRAFT_INTERVAL_SECONDS",
]

# Host facts in <base>/placement.env: who may talk to the assistant, where the daily
# backups go (a folder owned by the container user, uid 10001), the worker's loopback
# health port, and the production gateway's Compose network.
placement = [
    "TELEGRAM_ALLOWED_USER_IDS", "BACKUP_DIR", "AGENT_HEALTH_PORT", "AGENT_GATEWAY_NETWORK",
]
# Files <base>/secrets/<NAME>, set by the operator with `af_engine.py secret-set`. The
# Telegram token and the restic password move from the laptop with the data; the gateway
# key is the project's production key, issued on the gateway straight into the store.
secrets = ["POSTGRES_PASSWORD", "TELEGRAM_BOT_TOKEN", "GATEWAY_API_KEY", "RESTIC_PASSWORD"]
production_environments = ["production"]

[defaults]
production = "deploy/env/production.env"

[formats]
LOG_LEVEL = "debug|info|warning|error"
TELEGRAM_ALLOWED_USER_IDS = "[1-9][0-9]{0,19}(,[1-9][0-9]{0,19})*"
BACKUP_DIR = "/[A-Za-z0-9_./-]{1,200}"
AGENT_HEALTH_PORT = "[0-9]{2,5}"
AGENT_GATEWAY_NETWORK = "[A-Za-z0-9][A-Za-z0-9_.-]{0,63}"

[prod_assert]
APP_ENV = "production"
