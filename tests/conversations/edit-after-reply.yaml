name: edit-after-reply
description: Changing a request after the reply gets a new reply that responds to the change.
steps:
  - send: "schedule me a meeting at 3 at Kopi Kalyan with Dina"
    ref: plan
  - settle: true
  - wait: 60
  - edit:
      ref: plan
      text: "schedule me a meeting at 4 at Kopi Kalyan with Dina"
expect:
  turns: 2
  model_calls: 2
  user_contains: ["Before: schedule me a meeting at 3 at Kopi Kalyan with Dina\nAfter: schedule me a meeting at 4 at Kopi Kalyan with Dina"]
  context_contains: ["edited a message you already answered"]
