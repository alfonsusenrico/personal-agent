name: intro-later
description: The owner declines the offered introduction; it is not offered again.
owner: fresh
steps:
  - send: "hey there"
  - press: "Later"
  - wait: 60
  - send: "how's it going?"
fake_replies:
  - "Hey! Want to do a quick introduction?"
  - "All good here. You?"
expect:
  introduction_state: declined
  model_calls: 2
  profile_absent: [address]
expect_fake:
  sent_methods: [sendRichMessage, sendRichMessage]
