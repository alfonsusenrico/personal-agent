name: intro-edit
description: The owner finishes early, edits one answer at the summary, then saves.
owner: fresh
steps:
  - send: "/start"
  - settle: true
  - wait: 20
  - send: "Call me Sam"
  - settle: true
  - wait: 20
  - send: "Call yourself Nara. That's enough for now, let's finish"
  - press: "Edit"
  - settle: true
  - wait: 20
  - send: "Actually, call me Sammy"
  - press: "Save"
fake_replies:
  - "Hi! What should I call you?"
  - "Nice to meet you, Sam! And my name?<pa-profile field=\"address\">Sam</pa-profile>"
  - "Nara it is. Here's what I have.<pa-profile field=\"assistant_name\">Nara</pa-profile><pa-intro-summary/>"
  - "Sure, what should change?"
  - "Sammy it is.<pa-profile field=\"address\">Sammy</pa-profile>"
expect:
  introduction_state: completed
  profile_active:
    address: Sammy
    assistant_name: Nara
  bot_names: [Nara]
expect_fake:
  sent_contains: ["Skipped: Language", "**What to call you:** Sammy"]
