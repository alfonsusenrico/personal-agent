name: requested-effect
description: A message with an effect when asked; "dislike this message" is a reaction.
steps:
  - send: "send me a message with fire effect"
  - settle: true
  - wait: 20
  - send: "dislike this message"
fake_replies:
  - "<pa-effect name=\"fire\"/>🔥"
  - "<pa-effect name=\"dislike\"/>"
expect:
  turns: 2
  turn_statuses: [answered, answered]
expect_fake:
  sent_methods: [sendRichMessage, setMessageReaction]
  sent_contains: ["[with an effect]"]
