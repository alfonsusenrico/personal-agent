[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal assistant over Telegram with reliable memory, personal data sync, and app learning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alfonsus Enrico", email = "enrico.soebijanto@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx2>=2.13.1,<3",
    "llm-gateway-client",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
personal-agent-migrate = "personal_agent.db.migrate:main"
personal-agent-worker = "personal_agent.worker:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixture credentials for disposable services.
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "db: needs the disposable Postgres database; fails instead of skipping when REQUIRE_DB=1",
]

[tool.uv.sources]
llm-gateway-client = { git = "https://github.com/alfonsusenrico/llm-gateway.git", subdirectory = "clients/python", rev = "505f6e10207aff4efdec64648421c4e5548f270e" }
